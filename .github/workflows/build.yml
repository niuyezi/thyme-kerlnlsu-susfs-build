name: thyme PixelOS multi-variant KSU kernel (AK3)

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "JSON array of variants. Default: ksun-susfs (bundled KernelSU-Next + SUSFS). ksun-legacy = no SUSFS; bakasu = EXPERIMENTAL."
        required: true
        type: string
        default: '["ksun-susfs"]'
      kernel_repo:
        description: "Kernel source repository"
        required: true
        type: string
        default: "https://github.com/Flicker-Android-Devices/kernel_xiaomi_sm8250"
      kernel_ref:
        description: "Kernel branch/tag/commit SHA (ignored when boot_image_url is set)"
        required: true
        type: string
        default: "e7dc99d5350d3f443946af44b196c9fa6f2cb02a"
      defconfig:
        description: "Defconfig name under arch/arm64/configs/"
        required: true
        type: string
        default: "thyme_defconfig"
      ksun_ref:
        description: "KernelSU-Next ref (ksun-legacy variant)"
        required: true
        type: string
        default: "legacy"
      sukisu_repo:
        description: "SukiSU-Nova repository (sukisu-susfs variant)"
        required: true
        type: string
        default: "https://github.com/SukiSU-Nova/SukiSU-Nova"
      sukisu_ref:
        description: "SukiSU-Nova ref (builtin-new = SUSFS inline-hook + KPM, no kprobes)"
        required: true
        type: string
        default: "builtin-new"
      bakasu_repo:
        description: "BakaSU repository (renamed from ReSukiSU -> Baka-SU/BakaSU)"
        required: true
        type: string
        default: "https://github.com/Baka-SU/BakaSU"
      bakasu_ref:
        description: "BakaSU ref (UNVERIFIED - CI asserts will validate)"
        required: true
        type: string
        default: "main"
      clang_version:
        description: "AOSP prebuilt clang directory name"
        required: true
        type: string
        default: "clang-r596125"
      boot_image_url:
        description: "Optional: URL of a thyme boot.img. Derives kernel_ref and input/device.config from it."
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_REF: ${{ inputs.kernel_ref }}
      DEFCONFIG: ${{ inputs.defconfig }}
      KSU_REF: ${{ inputs.ksun_ref }}
      SUKISU_REPO: ${{ inputs.sukisu_repo }}
      SUKISU_REF: ${{ inputs.sukisu_ref }}
      BAKASU_REPO: ${{ inputs.bakasu_repo }}
      BAKASU_REF: ${{ inputs.bakasu_ref }}
      CLANG_VERSION: ${{ inputs.clang_version }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout this workflow repo
        uses: actions/checkout@v7.0.1

      - name: Show variant banner
        run: |
          set -euo pipefail
          echo "=============================================="
          echo " Building variant: $VARIANT"
          echo "=============================================="
          case "$VARIANT" in
            ksun-legacy)   echo " KernelSU-Next legacy (syscall-table hook, NO SUSFS) - VERIFIED path";;
            ksun-susfs)    echo " Bundled KernelSU-Next + SUSFS (susfs4ksu official scheme)";;
            bakasu)        echo " BakaSU (formerly ReSukiSU) - UNVERIFIED, asserts will validate";;
            *) echo "Unknown variant: $VARIANT"; exit 1;;
          esac

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential curl git ca-certificates zip unzip \
            libssl-dev libelf-dev libncurses-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            python3 python-is-python3 zstd lz4 cpio file
          printf '#!/bin/sh\nexec python3 "$@"\n' | sudo tee /usr/local/bin/python2 > /dev/null
          sudo chmod +x /usr/local/bin/python2
          python2 --version

      # Same derive logic as the verified KSUN workflow: read header v3,
      # expand -g<sha> from the banner, extract embedded config.gz.
      - name: Derive kernel ref and config from boot image
        if: ${{ inputs.boot_image_url != '' }}
        env:
          BOOT_URL: ${{ inputs.boot_image_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/boot.img" "$BOOT_URL"
          ls -l "$RUNNER_TEMP/boot.img"
          python3 - <<'PY'
          import os, re, struct, zlib
          from pathlib import Path

          data = (Path(os.environ['RUNNER_TEMP']) / 'boot.img').read_bytes()
          assert data[:8] == b'ANDROID!', 'not an Android boot image'
          header_version = struct.unpack_from('<I', data, 40)[0]
          kernel_size = struct.unpack_from('<I', data, 8)[0]

          if header_version >= 3:
              koff = 4096
          else:
              page_size = struct.unpack_from('<I', data, 36)[0]
              assert page_size in (2048, 4096, 8192, 16384), f'bad page_size {page_size}'
              koff = page_size

          kernel = data[koff:koff + kernel_size]
          assert len(kernel) == kernel_size, 'truncated kernel region'
          print(f'header v{header_version}: kernel {kernel_size:,d} B at {koff}')

          m = re.search(rb'Linux version \d+\.\d+\.\d+[^\x00\n]{0,160}', kernel)
          assert m, 'no "Linux version" banner found in the Image'
          banner = m.group(0).decode('ascii', 'replace')
          print('banner:', banner[:160])
          cm = re.search(r'-g([0-9a-f]{7,40})', banner)
          assert cm, 'banner has no -g<sha> localversion; set kernel_ref manually'
          ref = cm.group(1)
          print('derived short sha:', ref)

          if len(ref) < 40:
              import json, urllib.error, urllib.request
              mm = re.search(r'github\.com[:/]([^/]+)/([^/]+?)(?:\.git)?/?$',
                             os.environ.get('KERNEL_REPO', ''))
              assert mm, 'cannot parse kernel_repo; pass kernel_ref manually'
              api = (f'https://api.github.com/repos/{mm.group(1)}/{mm.group(2)}'
                     f'/commits/{ref}')
              token = os.environ.get('GITHUB_TOKEN')

              def _resolve(with_token):
                  rq = urllib.request.Request(api, headers={
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'thyme-ks-build'})
                  if with_token and token:
                      rq.add_header('Authorization', f'Bearer {token}')
                  with urllib.request.urlopen(rq, timeout=30) as r:
                      return json.loads(r.read())['sha']

              try:
                  ref = _resolve(True)
              except urllib.error.HTTPError as e:
                  if e.code not in (401, 403):
                      raise
                  print(f'API rejected the token ({e.code}), retrying anonymously')
                  ref = _resolve(False)
              print('expanded kernel_ref:', ref)
          assert re.fullmatch(r'[0-9a-f]{40}', ref), f'not a full commit sha: {ref}'

          cfg = None
          pos = 0
          while True:
              i = kernel.find(b'\x1f\x8b\x08', pos)
              if i < 0:
                  break
              pos = i + 1
              try:
                  out = zlib.decompressobj(wbits=31).decompress(kernel[i:i + 8 * 1024 * 1024])
              except Exception:
                  continue
              if b'CONFIG_' in out[:4000] and b'\nCONFIG_' in out:
                  cfg = out.decode('utf-8', 'replace')
                  break
          assert cfg, 'no embedded config.gz (CONFIG_IKCONFIG not set?)'

          lines = cfg.replace('\r\n', '\n').splitlines()
          print(f'derived config: {len(lines)} lines')
          assert len(lines) > 1000, 'extracted config looks truncated'
          assert 'CONFIG_OVERLAY_FS=y' in cfg, 'config lacks CONFIG_OVERLAY_FS=y'

          Path('input/device.config').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'KERNEL_REF={ref}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('### Derived from boot image\n\n')
              f.write('| field | value |\n|---|---|\n')
              f.write(f'| header version | v{header_version} |\n')
              f.write(f'| kernel_ref | `{ref}` |\n')
              f.write(f'| config lines | {len(lines)} |\n')
          print('wrote input/device.config; KERNEL_REF exported for later steps')
          PY

      - name: Clone kernel source
        run: |
          set -euo pipefail
          mkdir -p kernel
          git -C kernel init -q
          git -C kernel remote add origin "$KERNEL_REPO"
          git -C kernel fetch --depth 1 origin "$KERNEL_REF"
          git -C kernel checkout -q FETCH_HEAD
          echo "kernel HEAD: $(git -C kernel rev-parse HEAD)"
          echo "kernel version: $(make -C kernel kernelversion)"
          test -f "kernel/arch/arm64/configs/$DEFCONFIG" || {
            echo "Defconfig not found: kernel/arch/arm64/configs/$DEFCONFIG" >&2
            exit 1
          }

      - name: Get AOSP clang toolchain
        run: |
          set -euo pipefail
          mkdir -p toolchains
          git clone --depth 1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchains/clang-aosp
          git -C toolchains/clang-aosp sparse-checkout set "$CLANG_VERSION"
          CLANG_BIN="$GITHUB_WORKSPACE/toolchains/clang-aosp/$CLANG_VERSION/bin"
          test -x "$CLANG_BIN/clang" || {
            echo "clang not found at $CLANG_BIN/clang" >&2
            exit 1
          }
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          export PATH="$CLANG_BIN:$PATH"
          clang --version | head -n 2
          ld.lld --version | head -n 1
          aarch64-linux-gnu-gcc --version | head -n 1

      - name: Get Python3 mkdtboimg
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fLSs \
            "https://raw.githubusercontent.com/PixelOS-AOSP/android_system_libufdt/seventeen/utils/src/mkdtboimg.py" \
            -o tools/mkdtboimg.py
          python3 -m py_compile tools/mkdtboimg.py
          MKDTBO_EXT="$GITHUB_WORKSPACE/tools/mkdtboimg.py"
          echo "MKDTBO_EXT=$MKDTBO_EXT" >> "$GITHUB_ENV"

      # The Flicker tree ships ORIGINAL KernelSU manual hooks as committed
      # source (e.g. drivers/tty/pty.c calls ksu_handle_devpts() under
      # #ifdef CONFIG_KSU). Every variant below provides its own hook entry
      # points with DIFFERENT signatures, so the committed calls become
      # undefined symbols at link time. Strip all pure hook blocks first.
      # (Same verified logic as the KSUN workflow; runs for ALL variants.)
      - name: Remove legacy KernelSU inline hooks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          root = Path('kernel')
          skip_dirs = {'kernelsu', 'KernelSU-Next', 'out', '.git'}

          block = re.compile(
              r'(?m)^[ \t]*#(?:ifdef[ \t]+CONFIG_KSU'
              r'|if[ \t]+defined\s*\(\s*CONFIG_KSU\s*\))[ \t]*\n'
              r'((?:(?![ \t]*#(?:endif|else|elif|ifdef|ifndef)\b)[^\n]*\n)+?)'
              r'[ \t]*#endif[^\n]*\n')

          targets = []
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames[:] = [d for d in dirnames if d not in skip_dirs]
              for fn in filenames:
                  if fn.endswith(('.c', '.h')):
                      targets.append(Path(dirpath) / fn)

          def is_pure_hook_lines(body):
              lines = [l.strip() for l in body.splitlines() if l.strip()]
              if not lines:
                  return False
              return all('ksu_handle_' in l and l.endswith(';')
                         and not l.startswith('//') for l in lines)

          changed = []
          for f in targets:
              t = f.read_text(encoding='utf-8', errors='replace')
              if 'ksu_handle_' not in t:
                  continue
              new = block.sub(lambda m: '' if is_pure_hook_lines(m.group(1))
                              else m.group(0), t)
              if new != t:
                  f.write_text(new, encoding='utf-8')
                  changed.append(f.relative_to(root).as_posix())

          print('=== removed pure #ifdef CONFIG_KSU hook blocks from ===')
          for r in changed:
              print('  ', r)
          if not changed:
              print('   (none)')

          remaining = []
          for f in targets:
              t = f.read_text(encoding='utf-8', errors='replace')
              for i, l in enumerate(t.splitlines(), 1):
                  if 'ksu_handle_' in l:
                      remaining.append(f'{f.relative_to(root).as_posix()}:{i}: {l.strip()[:150]}')
          print('=== remaining ksu_handle_* lines in kernel tree ===')
          for r in remaining[:60]:
              print('  ', r)
          if not remaining:
              print('   (none)')

          pty = root / 'drivers' / 'tty' / 'pty.c'
          assert pty.is_file(), 'drivers/tty/pty.c missing'
          assert 'ksu_handle_devpts' not in pty.read_text(encoding='utf-8', errors='replace'), \
              'legacy ksu_handle_devpts hook still present in pty.c'
          print('OK: pty.c no longer references ksu_handle_devpts')
          PY

      # =====================================================================
      # Variant 1: KernelSU-Next legacy (VERIFIED path, no SUSFS)
      # =====================================================================
      - name: '[ksun] Integrate KernelSU-Next'
        if: ${{ matrix.variant == 'ksun-legacy' }}
        run: |
          set -euo pipefail
          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/$KSU_REF/kernel/setup.sh" \
            -o ksu_setup.sh
          sha256sum ksu_setup.sh
          (cd kernel && sh ../ksu_setup.sh "$KSU_REF")

          test -f kernel/drivers/kernelsu/Makefile
          grep -q 'obj-$(CONFIG_KSU)' kernel/drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> kernel/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' kernel/drivers/Kconfig || \
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig
          ls -ld kernel/drivers/kernelsu

      # KSUN legacy 4.19 compatibility: can_umount spelling + the <5.8
      # copy_to_kernel_nofault shim both break on this backported tree.
      # (Verified fixes from the original thyme-ksun-build project.)
      - name: '[ksun] Patch KSU-Next for 4.19 compatibility'
        if: ${{ matrix.variant == 'ksun-legacy' }}
        run: |
          set -euo pipefail
          # integration state dump (helps diagnose failures without logs)
          ls -ld kernel/drivers/kernelsu
          readlink -f kernel/drivers/kernelsu
          ls kernel/drivers/kernelsu/ | head -20
          git -C kernel/KernelSU-Next rev-parse HEAD 2>/dev/null || true
          git -C kernel/KernelSU-Next branch --show-current 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          ksu = Path('kernel/drivers/kernelsu')
          assert ksu.is_dir(), 'KSU driver dir missing'
          real = ksu.resolve()
          print('KSU source dir:', real)
          kb = real / 'Kbuild'
          pm = real / 'hook' / 'patch_memory.c'
          assert kb.is_file(), 'Kbuild missing'
          assert pm.is_file(), 'hook/patch_memory.c missing'

          t = kb.read_text(encoding='utf-8')
          pat1 = re.compile(r'(grep\s+-Eq\s+["\'])\^static int can_umount(["\'])')
          hits1 = pat1.findall(t)
          if len(hits1) != 1:
              print('!! can_umount guard not matched exactly once. Lines containing can_umount:')
              for i, line in enumerate(t.splitlines(), 1):
                  if 'can_umount' in line:
                      print(f'  {i}: {line}')
              raise SystemExit(f'expected 1 can_umount grep, found {len(hits1)}')
          t = pat1.sub(lambda m: m.group(1) + '^static (inline )?int can_umount' + m.group(2), t)
          kb.write_text(t, encoding='utf-8')

          p = pm.read_text(encoding='utf-8')
          pat2 = re.compile(r'#if\s+LINUX_VERSION_CODE\s*<\s*KERNEL_VERSION\(5,\s*8,\s*0\)')
          hits2 = pat2.findall(p)
          if len(hits2) != 1:
              print('!! 5.8 version guard not matched exactly once. Lines containing KERNEL_VERSION:')
              for i, line in enumerate(p.splitlines(), 1):
                  if 'KERNEL_VERSION' in line:
                      print(f'  {i}: {line}')
              raise SystemExit(f'expected 1 version guard, found {len(hits2)}')
          p = pat2.sub('#if 0  /* 4.19 already provides copy_to_kernel_nofault() */', p)
          pm.write_text(p, encoding='utf-8')

          kb_txt = kb.read_text(encoding='utf-8')
          pm_txt = pm.read_text(encoding='utf-8')
          assert '^static (inline )?int can_umount' in kb_txt, 'patch 1 did not persist'
          assert '#if 0  /* 4.19 already provides copy_to_kernel_nofault() */' in pm_txt, 'patch 2 did not persist'
          print('KSU 4.19 compatibility patches applied and verified')
          PY

      # UAPI 6 driver fd needs the reboot supercall hook inline (before
      # ns_capable) - kprobes cannot be used on 4.19.
      - name: '[ksun] Add reboot supercall hook'
        if: ${{ matrix.variant == 'ksun-legacy' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kernel/kernel/reboot.c')
          assert path.is_file(), f'missing {path}'
          text = path.read_text(encoding='utf-8', errors='replace')

          if 'ksu_handle_sys_reboot' in text:
              print('reboot hook already present, skipping')
              raise SystemExit(0)

          lines = text.splitlines(keepends=True)
          starts = [i for i, l in enumerate(lines)
                    if 'SYSCALL_DEFINE4(reboot' in l]
          assert len(starts) == 1, f'expected 1 reboot syscall, found {len(starts)}'
          start = starts[0]

          anchor = None
          for j in range(start, min(start + 40, len(lines))):
              if 'int ret = 0;' in lines[j]:
                  anchor = j
                  break
          assert anchor is not None, 'int ret = 0; not found in reboot syscall'

          hook = [
              '#ifdef CONFIG_KSU\n',
              '\textern int ksu_handle_sys_reboot(int, int, unsigned int, void __user **);\n',
              '\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n',
              '#endif\n',
              '\n',
          ]
          lines[anchor + 1:anchor + 1] = hook
          path.write_text(''.join(lines), encoding='utf-8')

          out = path.read_text(encoding='utf-8', errors='replace')
          assert out.count('ksu_handle_sys_reboot') == 2, 'hook was not written exactly once'
          assert 'ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);' in out
          i_hook = out.index('ksu_handle_sys_reboot(magic1')
          i_cap = out.index('ns_capable', i_hook)
          assert i_cap > i_hook, 'hook must precede the ns_capable() check'
          print('OK: reboot supercall hook inserted before capability checks')
          PY

      # Module system (post-fs-data) needs the newfstat st_size bump inline.
      - name: '[ksun] Add newfstat ret hook for module system'
        if: ${{ matrix.variant == 'ksun-legacy' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ksu_src = Path('kernel/drivers/kernelsu/runtime/ksud_integration.c')
          assert ksu_src.is_file(), f'missing {ksu_src}'
          assert 'void ksu_handle_newfstat_ret(' in \
              ksu_src.read_text(encoding='utf-8', errors='replace'), \
              'KSUN no longer exports ksu_handle_newfstat_ret()'

          path = Path('kernel/fs/stat.c')
          assert path.is_file(), f'missing {path}'
          text = path.read_text(encoding='utf-8', errors='replace')

          if 'ksu_handle_newfstat_ret' in text:
              print('newfstat ret hook already present, skipping')
              raise SystemExit(0)

          lines = text.splitlines(keepends=True)
          starts = [i for i, l in enumerate(lines)
                    if re.match(r'^[ \t]*SYSCALL_DEFINE2\(newfstat\b', l)]
          assert len(starts) == 1, \
              f'expected 1 native SYSCALL_DEFINE2(newfstat), found {len(starts)}'
          start = starts[0]

          ret_idx = None
          for j in range(start, min(start + 25, len(lines))):
              if j > start and 'SYSCALL_DEFINE' in lines[j]:
                  break
              if lines[j].strip() == 'return error;':
                  ret_idx = j
                  break
          assert ret_idx is not None, 'return error; not found in newfstat'

          call = [
              '\n',
              '#ifdef CONFIG_KSU\n',
              '\tksu_handle_newfstat_ret(&fd, &statbuf);\n',
              '#endif\n',
          ]
          lines[ret_idx:ret_idx] = call

          decl = [
              '#ifdef CONFIG_KSU\n',
              'extern void ksu_handle_newfstat_ret(unsigned int *, struct stat __user **);\n',
              '#endif\n',
          ]
          lines[start:start] = decl
          path.write_text(''.join(lines), encoding='utf-8')

          out = path.read_text(encoding='utf-8', errors='replace')
          assert out.count('ksu_handle_newfstat_ret') == 2, 'hook was not written exactly once'
          assert 'extern void ksu_handle_newfstat_ret(' in out
          assert 'ksu_handle_newfstat_ret(&fd, &statbuf);' in out
          i_decl = out.index('extern void ksu_handle_newfstat_ret(')
          i_sys = out.index('SYSCALL_DEFINE2(newfstat')
          i_hook = out.index('ksu_handle_newfstat_ret(&fd')
          assert i_decl < i_sys, 'extern declaration must be at file scope'
          i_cp = out.index('cp_new_stat(&stat, statbuf)', i_sys)
          assert i_cp < i_hook, 'hook must be after cp_new_stat()'
          assert i_hook < out.index('return error;', i_hook), 'hook must be before return error;'
          assert 'ksu_handle_stat' not in out, \
              'legacy ksu_handle_stat hooks still present - cleanup did not run first'
          print('OK: newfstat ret hook inserted (file-scope extern + in-body call)')
          PY

      - name: '[ksun] Prepare config'
        if: ${{ matrix.variant == 'ksun-legacy' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('input/device.config').read_text(encoding='utf-8', errors='replace').splitlines()
          def is_ksu(l):
              s = l.strip()
              if s.startswith('# ') and ' is not set' in s:
                  return s.split()[1].startswith('CONFIG_KSU')
              if '=' in l and not s.startswith('#'):
                  return s.split('=', 1)[0].startswith('CONFIG_KSU')
              return False
          out = [l for l in src if not is_ksu(l)]
          forced = {'CONFIG_KPROBES=y', 'CONFIG_KPROBE_EVENTS=y', 'CONFIG_KRETPROBES=y'}
          out = [l for l in out if l.strip() not in forced]
          out += [
              'CONFIG_KSU=y',
              '# CONFIG_KSU_MANUAL_HOOK is not set',
              '# CONFIG_KSU_KPROBES_HOOK is not set',
              'CONFIG_KSU_SYSCALL_TABLE_HOOK=y',
          ]
          Path('input/device-variant.config').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('wrote input/device-variant.config:', len(out), 'lines')
          PY

      # =====================================================================
      # Variant 2: SukiSU-Nova builtin + SUSFS
      # =====================================================================
      - name: '[ksun-susfs] Apply SUSFS to bundled KernelSU-Next'
        if: ${{ matrix.variant == 'ksun-susfs' }}
        run: |
          set -euo pipefail
          # This Flicker tree already bundles a KernelSU-Next copy at
          # drivers/kernelsu whose source layout matches susfs4ksu's KSU-side
          # patch (10_enable_susfs_for_ksu.patch). KEEP it and apply our
          # pre-adapted version (patches/susfs-ksu-thyme.patch): 4 hunks were
          # adapted to this tree (function renames, extra system_ext umount
          # target, signature-table manager check, dedup Makefile).
          # The patch adds KSU_SUSFS* Kconfig options + SUSFS support code.
          cd kernel/drivers/kernelsu
          patch -p2 --forward --no-backup-if-mismatch < ../../../patches/susfs-ksu-thyme.patch
          grep -q 'config KSU_SUSFS' Kconfig
          grep -q 'ksu_apply_kernelsu_rules' selinux/rules.c
          grep -q 'ksu_is_manager_apk' apk_sign.c
          grep -q 'susfs_try_umount_all' core_hook.c
          echo 'OK: bundled KernelSU-Next patched with SUSFS support'

      # SUSFS needs its OWN kernel-side patches (susfs4ksu). The
      # KSU_SUSFS_INLINE_HOOK backend (the ONLY hook backend when SUSFS is
      # enabled) relies on inline hooks that these patches place in the
      # kernel source. Without them the kernel fails to link or SUSFS
      # silently does nothing.
      # patches/susfs-thyme.patch is a PRE-ADAPTED version of susfs4ksu's
      # 50_add_susfs_in_kernel-4.19.patch: the stock patch has 8 rejected
      # hunks on this tree (fs_context mount path, KABI field order,
      # extra includes, may_create signature, ROM's own map-spoofing).
      # The adaptation was verified locally with git apply --check AND
      # apply on the exact Flicker sources at KERNEL_REF.
      # NOTE: KSU_HACK_ARM64_BRANCH_LINK / KSU_TAMPER_SYSCALL_TABLE both
      # 'depends on !KSU_SUSFS' - mutually exclusive with SUSFS.
      - name: '[ksun-susfs] Apply SUSFS kernel patches (pre-adapted for thyme)'
        if: ${{ matrix.variant == 'ksun-susfs' }}
        run: |
          set -euo pipefail
          # susfs userspace-facing sources (fs/susfs.c, fs/sus_su.c and
          # include/linux/susfs*.h, sus_su.h) are NOT in the .patch - copy them
          # from the matching susfs4ksu branch.
          git clone --depth 1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu "$RUNNER_TEMP/susfs4ksu"
          cd kernel
          cp -r "$RUNNER_TEMP/susfs4ksu/kernel_patches/fs/." fs/
          cp -r "$RUNNER_TEMP/susfs4ksu/kernel_patches/include/linux/." include/linux/
          git apply --stat ../patches/susfs-thyme.patch
          git apply ../patches/susfs-thyme.patch
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h
          test -f fs/susfs.c
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          grep -q 'susfs_mnt_id_backup' include/linux/mount.h
          grep -q 'susfs_sus_ino_for_show_map_vma' fs/proc/task_mmu.c
          echo "OK: SUSFS pre-adapted patch applied cleanly, susfs sources in place"

      - name: '[ksun-susfs] Prepare config'
        if: ${{ matrix.variant == 'ksun-susfs' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('input/device.config').read_text(encoding='utf-8', errors='replace').splitlines()
          def is_ksu(l):
              s = l.strip()
              if s.startswith('# ') and ' is not set' in s:
                  return s.split()[1].startswith('CONFIG_KSU')
              if '=' in l and not s.startswith('#'):
                  return s.split('=', 1)[0].startswith('CONFIG_KSU')
              return False
          out = [l for l in src if not is_ksu(l)]
          out = [l for l in out if not l.split('=')[0].strip().startswith('CONFIG_KPM')]
          # Option set matches susfs4ksu v1.5.5 (the version whose
          # 50_add/10_enable patches we apply). These are added to the bundled
          # KernelSU Kconfig by patches/susfs-ksu-thyme.patch.
          out += [
              'CONFIG_KSU=y',
              'CONFIG_KSU_SUSFS=y',
              'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y',
              'CONFIG_KSU_SUSFS_SUS_PATH=y',
              'CONFIG_KSU_SUSFS_SUS_MOUNT=y',
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y',
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y',
              'CONFIG_KSU_SUSFS_SUS_KSTAT=y',
              'CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y',
              'CONFIG_KSU_SUSFS_TRY_UMOUNT=y',
              'CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y',
              'CONFIG_KSU_SUSFS_SPOOF_UNAME=y',
              '# CONFIG_KSU_SUSFS_ENABLE_LOG is not set',
              'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y',
              'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y',
              'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y',
              '# CONFIG_KPM is not set',
          ]
          Path('input/device-variant.config').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('wrote input/device-variant.config:', len(out), 'lines')
          PY

      # =====================================================================
      # Variant 3: BakaSU (formerly ReSukiSU) - UNVERIFIED upstream.
      # CI asserts validate the integration; if the ref/branch/hook method
      # does not match, the job fails EARLY with a clear message instead of
      # producing a broken kernel.
      # =====================================================================
      - name: '[bakasu] Integrate BakaSU'
        if: ${{ matrix.variant == 'bakasu' }}
        run: |
          set -euo pipefail
          # BakaSU was renamed: ReSukiSU/ReSukiSU now redirects to
          # Baka-SU/BakaSU (the old fallback 'BakaSU/BakaSU' does NOT exist).
          REPO_PATH=$(echo "$BAKASU_REPO" | sed 's#https://github.com/##; s#\.git$##')
          curl -fLSs \
            "https://raw.githubusercontent.com/$REPO_PATH/$BAKASU_REF/kernel/setup.sh" \
            -o bakasu_setup.sh
          sha256sum bakasu_setup.sh
          (cd kernel && sh ../bakasu_setup.sh "$BAKASU_REF")

          test -f kernel/drivers/kernelsu/Makefile
          grep -q 'obj-$(CONFIG_KSU)' kernel/drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> kernel/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' kernel/drivers/Kconfig || \
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig
          ls -ld kernel/drivers/kernelsu

      # BakaSU is a KernelSU downstream fork. We ATTEMPT the same
      # branch-link hook as SukiSU (same ecosystem, recommended 4.19+),
      # but since this upstream is UNVERIFIED the assert below fails the
      # job early if the option is not offered. SUSFS presence is probed
      # and reported, not required.
      # BakaSU (Baka-SU/BakaSU, renamed from ReSukiSU) uses a DIFFERENT hook
      # scheme from what the original workflow assumed: its Kconfig offers
      # KSU_MANUAL_HOOK(+AUTO_*) / KSU_TRACEPOINT_HOOK, NOT
      # KSU_HACK_ARM64_BRANCH_LINK and NOT KSU_TAMPER_SYSCALL_TABLE.
      # It therefore needs its own manual-hook port (and, for SUSFS, the same
      # susfs4ksu kernel patches as the sukisu variant). Until that port is
      # written this variant fails EARLY with the full symbol list instead
      # of producing a broken kernel. It is excluded from default variants.
      - name: '[bakasu] Probe upstream + explain required port'
        if: ${{ matrix.variant == 'bakasu' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          ksu = Path('kernel/drivers/kernelsu')
          assert ksu.is_dir(), 'BakaSU driver dir missing'
          real = ksu.resolve()
          print('BakaSU source dir:', real)
          kconfig = real / 'Kconfig'
          assert kconfig.is_file(), 'Kconfig missing'
          t = kconfig.read_text(encoding='utf-8', errors='replace')
          print('=== KSU_* symbols offered by this BakaSU ref ===')
          for m in sorted(set(re.findall(r'config (KSU[A-Z0-9_]*)', t))):
              print('   ', m)
          print()
          print('BAKASU_NEEDS_MANUAL_PORT:')
          print(' - No BRANCH_LINK / TAMPER_SYSCALL_TABLE in this upstream.')
          print(' - Use KSU_MANUAL_HOOK style integration (manual kernel hooks)')
          print('   plus susfs4ksu kernel-4.19 patches if SUSFS is wanted.')
          print(' - The default variants list intentionally excludes bakasu.')
          raise SystemExit(1)
          PY

      - name: '[bakasu] Prepare config'
        if: ${{ matrix.variant == 'bakasu' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('input/device.config').read_text(encoding='utf-8', errors='replace').splitlines()
          def is_ksu(l):
              s = l.strip()
              if s.startswith('# ') and ' is not set' in s:
                  return s.split()[1].startswith('CONFIG_KSU')
              if '=' in l and not s.startswith('#'):
                  return s.split('=', 1)[0].startswith('CONFIG_KSU')
              return False
          out = [l for l in src if not is_ksu(l)]
          out = [l for l in out if not l.split('=')[0].strip().startswith('CONFIG_KPM')]
          out += [
              'CONFIG_KSU=y',
              'CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y',
              '# CONFIG_KSU_KPROBES_KSUD is not set',
              '# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set',
              '# CONFIG_KPM is not set',
          ]
          # Enable SUSFS sub-options ONLY if the integrated Kconfig offers them
          ksu_kconfig = Path('kernel/drivers/kernelsu/Kconfig')
          if ksu_kconfig.exists():
              t = ksu_kconfig.read_text(encoding='utf-8', errors='replace')
              if 'CONFIG_KSU_SUSFS' in t:
                  out += [
                      'CONFIG_KSU_SUSFS=y',
                      'CONFIG_KSU_SUSFS_SUS_MOUNT=y',
                      'CONFIG_KSU_SUSFS_SUS_KSTAT=y',
                      'CONFIG_KSU_SUSFS_SUS_PATH=y',
                      'CONFIG_KSU_SUSFS_SPOOF_UNAME=y',
                      'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y',
                  ]
          Path('input/device-variant.config').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('wrote input/device-variant.config:', len(out), 'lines')
          PY

      # =====================================================================
      # Common: build + AK3 packaging
      # =====================================================================
      - name: Build final kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          MAKE_ARGS="O=../out/final ARCH=arm64 LLVM=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- MKDTBO_EXT=$MKDTBO_EXT"
          mkdir -p ../out/final
          cp ../input/device-variant.config ../out/final/.config
          make $MAKE_ARGS olddefconfig
          echo "--- resolved KSU config ---"
          grep -E '^#? ?CONFIG_(KSU|KSU_SUSFS|KPM|KPROBES) ' ../out/final/.config || true
          # HARD ASSERTIONS on the FINAL config (olddefconfig silently flips
          # unsatisfied symbols back to n):
          grep -q '^CONFIG_KSU=y' ../out/final/.config
          case "$VARIANT" in
            ksun-legacy)
              grep -q '^CONFIG_KSU_SYSCALL_TABLE_HOOK=y' ../out/final/.config || {
                echo "FAIL: CONFIG_KSU_SYSCALL_TABLE_HOOK did not resolve to y"; exit 1; }
              ;;
            ksun-susfs)
              grep -q '^CONFIG_KSU_SUSFS=y' ../out/final/.config || {
                echo "FAIL: CONFIG_KSU_SUSFS did not resolve to y"; exit 1; }
              grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y' ../out/final/.config || {
                echo "FAIL: CONFIG_KSU_SUSFS_SUS_PATH did not resolve to y"; exit 1; }
              grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y' ../out/final/.config || {
                echo "FAIL: CONFIG_KSU_SUSFS_SUS_MOUNT did not resolve to y"; exit 1; }
              ;;
            bakasu)
              grep -q '^CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y' ../out/final/.config || {
                echo "FAIL: CONFIG_KSU_HACK_ARM64_BRANCH_LINK did not resolve to y (see assert step)"; exit 1; }
              ;;
          esac
          echo "OK: variant config assertions passed"
          cp ../out/final/.config ../final-defconfig.config
          make -j"$(nproc)" $MAKE_ARGS 2>&1 | tee ../build-final.log
          test -f ../out/final/arch/arm64/boot/Image
          find ../out/final/arch/arm64/boot -maxdepth 3 -type f \
            \( -name 'Image' -o -name 'Image.gz' -o -name '*.dtb' -o -name 'dtbo.img' \) \
            -exec sha256sum {} + | tee ../artifacts.sha256

      - name: Build AnyKernel3 zip
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git "$RUNNER_TEMP/AnyKernel3"
          cp AK3/anykernel.sh "$RUNNER_TEMP/AnyKernel3/anykernel.sh"
          # stamp the variant name into the installer banner
          case "$VARIANT" in
            ksun-legacy)  KS="KernelSU-Next 4.19.325 (thyme / PixelOS A17)";;
            ksun-susfs)    KS="KernelSU-Next+SUSFS 4.19.325 (thyme / PixelOS A17)";;
            bakasu)       KS="BakaSU 4.19.325 (thyme / PixelOS A17)";;
          esac
          sed -i "s/^kernel.string=.*/kernel.string=$KS/" "$RUNNER_TEMP/AnyKernel3/anykernel.sh"
          sed -i "s/KernelSU variant : .*/KernelSU variant : $KS/" "$RUNNER_TEMP/AnyKernel3/anykernel.sh"
          # the template's final banner hardcodes the SukiSU manager name;
          # make it variant-correct
          case "$VARIANT" in
            ksun-legacy)  MGR="KernelSU-Next";;
            ksun-susfs)    MGR="KernelSU-Next";;
            bakasu)       MGR="BakaSU";;
          esac
          sed -i "s/Done! Reboot and install the .* manager APK\./Done! Reboot and install the $MGR manager APK./" "$RUNNER_TEMP/AnyKernel3/anykernel.sh"
          grep -n 'kernel.string=' "$RUNNER_TEMP/AnyKernel3/anykernel.sh"
          SHA8=$(sha256sum out/final/arch/arm64/boot/Image | cut -c1-8)
          python3 AK3/make_ak3_zip.py \
            --template "$RUNNER_TEMP/AnyKernel3" \
            --image out/final/arch/arm64/boot/Image \
            --out "thyme-$VARIANT-anykernel3-$SHA8.zip"
          sha256sum "thyme-$VARIANT-anykernel3-$SHA8.zip" | tee ak3zip.sha256

      - name: Collect diagnostics
        if: always()
        run: |
          set -uo pipefail
          {
            echo "=== variant: $VARIANT ==="
            if [ ! -s build-final.log ]; then
              echo "!! build-final.log is missing or EMPTY: the final kernel build did NOT run."
              echo "!! The real failure is in a PRECEDING step."
              echo
            fi
            echo "=== compiler / make errors (last 60 hits) ==="
            grep -nEi 'error:|Error [0-9]+|\$\(error|FATAL|undefined reference|No rule to make target|not found|In file included' \
              build-final.log 2>/dev/null | grep -vi 'Broken pipe' | tail -n 60 || true
            echo "=== last 80 lines of build-final.log ==="
            tail -n 80 build-final.log 2>/dev/null || true
            echo "=== resolved KSU config ==="
            grep -E '^#? ?CONFIG_(KSU|KSU_SUSFS|KPM|KPROBES)' final-defconfig.config 2>/dev/null || true
          } > diagnostics.txt
          head -n 40 diagnostics.txt

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: thyme-${{ matrix.variant }}-build-logs
          path: |
            build-final.log
            diagnostics.txt
            final-defconfig.config
            input/device-variant.config
            ak3zip.sha256
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
          retention-days: 14

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: thyme-pixelos-${{ matrix.variant }}
          path: |
            thyme-$VARIANT-anykernel3-*.zip
            out/final/arch/arm64/boot/Image
            final-defconfig.config
            build-final.log
            artifacts.sha256
            ak3zip.sha256
            input/device.config
            input/device-variant.config
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
          retention-days: 14
